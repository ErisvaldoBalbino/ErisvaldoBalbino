<g fill="#b6f5c0">
<text x="200" y="160">complemento ao SUAP: simulador de notas, requisitos e calendário</text>
<text x="200" y="184">monitoramento colaborativo do abastecimento de água</text>
<text x="200" y="208">visualizador interativo de A* e busca gulosa</text>
<text x="200" y="232">trens sincronizados com semáforos, cliente/servidor TCP</text>
<text x="200" y="256">bot que conta os dias para as férias do IFRN</text>
</g>

<text x="28" y="294"><tspan fill="#39d353">erisvaldo</tspan><tspan fill="#5fae6e">:~$ </tspan><tspan fill="#eafff0">langs --repos</tspan></text>
