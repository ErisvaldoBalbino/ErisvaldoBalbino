<svg viewBox="0 0 840 420" width="840" xmlns="http://www.w3.org/2000/svg" role="img" font-family="'Fira Code','Cascadia Code',Consolas,'DejaVu Sans Mono',monospace" font-size="15">
<title>Terminal de Erisvaldo Balbino</title>
<desc>Card em estilo terminal CRT com apresentação, projetos em destaque e uma barra de repositórios por linguagem.</desc>
<style>
.cur { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { fill-opacity: 0; } }
</style>
<defs>
<pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#39d353" opacity="0.06"/></pattern>
<clipPath id="bar"><rect x="28" y="308" width="784" height="14" rx="3"/></clipPath>
</defs>
<rect x="1" y="1" width="838" height="418" rx="10" fill="#070d08" stroke="#1f6f33" stroke-width="2"/>
<rect x="2" y="2" width="836" height="34" rx="9" fill="#0f1f13"/>
<text x="420" y="24" text-anchor="middle" fill="#5fae6e" font-size="13">erisvaldo: ~</text>

<text x="28" y="72"><tspan fill="#39d353">erisvaldo</tspan><tspan fill="#5fae6e">:~$ </tspan><tspan fill="#eafff0">whoami</tspan></text>
<text x="28" y="96" fill="#b6f5c0">Estudante de ADS no IFRN · desenvolvedor de software</text>

<text x="28" y="136"><tspan fill="#39d353">erisvaldo</tspan><tspan fill="#5fae6e">:~$ </tspan><tspan fill="#eafff0">ls projetos/</tspan></text>
